name: release
# Push a tag like v1.2.0 to publish a release: installer + portable zip are built and attached.
# GitHub computes a SHA-256 digest for each asset, which the in-app updater verifies.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test
        run: dotnet test tests/SoundSwap.Core.Tests -c Release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer and portable zip
        shell: pwsh
        run: ./scripts/publish.ps1 -Version $env:VERSION -Installer -Portable
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/SoundSwap-Setup-*.exe
            artifacts/SoundSwap-*-portable.zip
